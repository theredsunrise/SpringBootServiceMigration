services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-servicea}
      POSTGRES_USER: ${DB_USERNAME:-servicea}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-servicea}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  service-a:
    build:
      context: ./serviceA
      dockerfile: Dockerfile
      args:
        PORT: ${PORT:-8080}
    environment:
      PORT: ${PORT:-8080}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-servicea}
      DB_USERNAME: ${DB_USERNAME:-servicea}
      DB_PASSWORD: ${DB_PASSWORD:-servicea}
      REDIS_HOST: redis
    expose:
      - "${PORT:-8080}"
    deploy:
      replicas: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/${PORT:-8080}'" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    profiles:
      - prod

  service-a-proxy:
    image: nginx:alpine
    environment:
      PORT: ${PORT:-8080}
      NGINX_ENVSUBST_FILTER: "^PORT$"
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./nginx/service-a.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      service-a:
        condition: service_healthy
    profiles:
      - prod

volumes:
  postgres-data:
