services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in .env}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "${DB_PORT:?DB_PORT must be set in .env}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  service-a:
    build:
      context: ./serviceA
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:?DB_NAME must be set in .env}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    expose:
      - "8080"
    deploy:
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    profiles:
      - prod

  service-a-proxy:
    image: nginx:alpine
    ports:
      - "${PORT:?PORT must be set in .env}:80"
    volumes:
      - ./nginx/service-a.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      service-a:
        condition: service_healthy
    profiles:
      - prod

volumes:
  postgres-data:
